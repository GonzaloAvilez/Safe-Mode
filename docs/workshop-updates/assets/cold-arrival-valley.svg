<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="460" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0b0b0b">Dónde se pierde el visitante hoy</text>
  <text x="40" y="66" font-size="14" fill="#52514e">Basado en feedback real, no en datos instrumentados — solo el tramo Arrival→Vulnerability</text>

  <!-- Confusion zone band -->
  <rect x="490" y="110" width="330" height="270" fill="#d03b3b" opacity="0.06"/>
  <text x="500" y="128" font-size="13" font-weight="600" fill="#d03b3b">Zona de confusión</text>

  <!-- Y axis qualitative anchors -->
  <text x="40" y="118" font-size="12" fill="#898781">más clara</text>
  <text x="40" y="386" font-size="12" fill="#898781">más confusa</text>
  <line x1="90" y1="110" x2="90" y2="380" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- Gridlines -->
  <line x1="90" y1="130" x2="820" y2="130" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="90" y1="255" x2="820" y2="255" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="90" y1="380" x2="820" y2="380" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Baseline -->
  <line x1="90" y1="380" x2="820" y2="380" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- Series line: Arrival(160,217.5) Curiosity(373,192.5) Doubt(587,330) Vulnerability(800,350) -->
  <path d="M 160 217.5 L 373 192.5 L 587 330 L 800 350"
        fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dotted continuation, unknown -->
  <path d="M 800 350 L 855 358" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="1,5" stroke-linecap="round"/>
  <text x="860" y="363" font-size="16" fill="#898781">?</text>

  <!-- Points -->
  <circle cx="160" cy="217.5" r="6" fill="#2a78d6"/>
  <circle cx="373" cy="192.5" r="6" fill="#2a78d6"/>
  <circle cx="587" cy="330" r="6" fill="#2a78d6"/>
  <circle cx="800" cy="350" r="8" fill="#d03b3b"/>

  <!-- Stage labels -->
  <text x="160" y="404" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Arrival</text>
  <text x="373" y="404" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Curiosity</text>
  <text x="587" y="404" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Doubt</text>
  <text x="800" y="404" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Vulnerability</text>

  <!-- Critical marker label (icon + label, per status color rule) -->
  <text x="700" y="300" font-size="13" font-weight="600" fill="#d03b3b">⚠ punto más bajo</text>
  <text x="700" y="318" font-size="12" fill="#52514e">confirmado por 4 fuentes</text>
  <text x="700" y="333" font-size="12" fill="#52514e">de feedback independientes</text>

  <!-- Footer note -->
  <text x="40" y="440" font-size="12" fill="#898781">El resto del journey (Validation→Belonging) no se representa: sin datos de respaldo todavía.</text>
</svg>
